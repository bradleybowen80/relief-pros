<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relief Pros HQ</title>
<style>
:root{
  --navy:#12293f; --navy2:#1c3b57; --teal:#1f8a70; --teal-dk:#166b56; --gold:#c8912a;
  --bg:#f5f8fa; --card:#ffffff; --soft:#eef3f6; --ink:#1a2732; --muted:#5b6a78;
  --line:#e4e9ee; --shadow:0 8px 30px rgba(18,41,63,.08);
  --danger:#b3372f; --danger-soft:#fbeceb; --amber:#8a6215; --amber-soft:#faf1de;
  --ok-soft:#e6f4ef; --chart1:#1f8a70; --chart2:#c8912a; --chart-grid:#dbe3ea;
  --side-bg:#12293f; --side-ink:#d9e4ee; --side-act:#1c3b57; --btn-ink:#ffffff;
  --chip:#eef3f6; --focus:#1f8a70; --track:#d7e6e1;
}
html[data-theme="dark"]{
  --bg:#0d1c2c; --card:#16304a; --soft:#1c3b57; --ink:#e9eff5; --muted:#a6b7c6;
  --line:#28455f; --shadow:0 8px 30px rgba(0,0,0,.35);
  --danger:#e5837b; --danger-soft:#47232a; --amber:#e0b25e; --amber-soft:#3d3117;
  --ok-soft:#1c4238; --chart1:#2aa585; --chart2:#bd8826; --chart-grid:#2b4a66;
  --side-bg:#0a1725; --side-ink:#c3d2df; --side-act:#1c3b57; --gold:#d9a844;
  --chip:#1c3b57; --focus:#2aa585; --track:#274a5f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14.5px; line-height:1.45;
}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--focus)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
a{color:var(--teal)}
h1,h2,h3{margin:0 0 8px;line-height:1.2}
h1{font-size:21px} h2{font-size:17px} h3{font-size:14.5px}
.muted{color:var(--muted)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.right{text-align:right} .nowrap{white-space:nowrap}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}

/* Shell */
#demo-banner{background:var(--gold);color:#1a2732;text-align:center;padding:6px 12px;font-weight:600;font-size:13px}
html[data-theme="dark"] #demo-banner{color:#101d2b}
.shell{display:flex;min-height:100vh}
.sidebar{
  width:212px;flex:0 0 auto;background:var(--side-bg);color:var(--side-ink);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  padding:14px 10px;transition:width .15s ease;z-index:30;
}
.logo{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;color:#fff;font-weight:700;font-size:15.5px;letter-spacing:.2px}
.logo .mark{width:30px;height:30px;border-radius:9px;background:var(--teal);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:800;flex:0 0 auto}
.logo .sub{display:block;font-weight:500;font-size:10.5px;color:var(--side-ink);opacity:.85}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;color:var(--side-ink);
  padding:9px 10px;border-radius:9px;font-size:14px;transition:background .15s ease,color .15s ease;
}
.nav button:hover{background:var(--side-act);color:#fff}
.nav button.active{background:var(--teal);color:#fff;font-weight:600}
.nav button .ic{width:20px;text-align:center;flex:0 0 auto;font-size:15px}
.nav button .kbd-hint{margin-left:auto;font-size:10.5px;opacity:.55}
.side-foot{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12)}
.side-foot button{display:flex;align-items:center;gap:10px;color:var(--side-ink);padding:8px 10px;border-radius:9px;font-size:13px}
.side-foot button:hover{background:var(--side-act);color:#fff}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:10px 22px;
}
.search-wrap{position:relative;flex:1;max-width:460px}
.search-wrap input{padding-left:32px;background:var(--card)}
.search-wrap .mag{position:absolute;left:10px;top:8px;color:var(--muted);pointer-events:none}
.search-pop{
  position:absolute;top:42px;left:0;right:0;background:var(--card);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);max-height:380px;overflow:auto;z-index:40;padding:6px;
}
.search-pop .grp{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:8px 10px 2px}
.search-pop .hit{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px}
.search-pop .hit:hover,.search-pop .hit.sel{background:var(--soft)}
.topbar .spacer{flex:1}
.userchip{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}

/* Buttons, chips, badges */
.btn{
  display:inline-flex;align-items:center;gap:7px;border-radius:10px;padding:8px 14px;font-weight:600;
  font-size:13.5px;transition:background .15s ease,box-shadow .15s ease,transform .15s ease;border:1px solid transparent;
}
.btn:active{transform:translateY(1px)}
.btn-pri{background:var(--teal);color:var(--btn-ink)}
.btn-pri:hover{background:var(--teal-dk)}
.btn-sec{background:var(--card);border-color:var(--line);color:var(--ink)}
.btn-sec:hover{background:var(--soft)}
.btn-danger{background:var(--danger);color:#fff}
html[data-theme="dark"] .btn-danger{color:#14212e}
.btn-ghost{color:var(--muted);padding:6px 9px;border-radius:8px}
.btn-ghost:hover{background:var(--soft);color:var(--ink)}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;color:var(--muted)}
.iconbtn:hover{background:var(--soft);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--chip);border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;color:var(--ink);white-space:nowrap}
.chip-teal{background:var(--ok-soft);color:var(--teal-dk)}
html[data-theme="dark"] .chip-teal{color:#7ed4bb}
.chip-gold{background:var(--amber-soft);color:var(--amber)}
.chip-red{background:var(--danger-soft);color:var(--danger)}
.chip-navy{background:var(--navy);color:#fff}
html[data-theme="dark"] .chip-navy{background:var(--soft);color:var(--ink)}
.sop-chip{
  display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.3px;
  color:var(--teal-dk);background:var(--ok-soft);border-radius:6px;padding:1px 7px;text-decoration:none;
}
html[data-theme="dark"] .sop-chip{color:#7ed4bb}
.sop-chip:hover{background:var(--teal);color:#fff}
.avatar{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff;flex:0 0 auto}
.avatar.S{background:var(--teal-dk)} .avatar.B{background:var(--navy2)} .avatar.SB{background:var(--gold);color:#1a2732}
.badge-wait{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--chip)}
.badge-wait.w-amber{background:var(--amber-soft);color:var(--amber)}
.badge-wait.w-red{background:var(--danger-soft);color:var(--danger)}

/* Cards and layout */
.view{padding:20px 22px 60px;max-width:1280px;width:100%;margin:0 auto}
.vhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.vhead h1{margin:0}
.vhead .spacer{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px}
.card-tight{padding:10px 12px}
.grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .kchart{width:100%;max-width:168px;height:auto;display:block}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600}
.kpi .val{font-size:24px;font-weight:700;line-height:1.1}
.kpi .val .unit{font-size:13px;color:var(--muted);font-weight:600}
.kpi .sub{font-size:11.5px;color:var(--muted)}
.kpi.warn{border-color:var(--gold)}
.kpi.warn .val{color:var(--amber)}
.meter{height:8px;border-radius:5px;background:var(--track);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:5px;background:var(--chart1);transition:width .3s ease}
.meter i.m-amber{background:var(--chart2)}
.meter i.m-red{background:var(--danger)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.bucket h3{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.6px}
.bucket h3 .cnt{background:var(--chip);border-radius:999px;padding:0 8px;font-size:11.5px;color:var(--ink)}
.bucket.overdue h3{color:var(--danger)}
.jobcard{
  background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  padding:10px 12px;margin-bottom:10px;transition:border-color .15s ease,transform .15s ease;
}
.jobcard:hover{border-color:var(--teal);transform:translateY(-1px)}
.jobcard .top{display:flex;align-items:center;gap:8px}
.jobcard .name{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jobcard .meta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.jobcard.overdue{border-left:3px solid var(--danger)}
.due-red{color:var(--danger);font-weight:700}
.progress{height:6px;border-radius:4px;background:var(--track);overflow:hidden;flex:1}
.progress i{display:block;height:100%;background:var(--chart1);transition:width .3s ease}
.empty{
  border:1.5px dashed var(--line);border-radius:14px;padding:26px 18px;text-align:center;color:var(--muted);
  font-size:13.5px;background:transparent;
}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:5px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(18,41,63,.15)}

/* Pipeline kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.kcol{flex:0 0 232px;background:var(--soft);border-radius:14px;padding:10px;min-height:120px}
.kcol h3{display:flex;align-items:center;gap:7px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:2px 4px}
.kcol h3 .cnt{margin-left:auto;background:var(--card);border-radius:999px;padding:0 7px;font-size:11px}
.kcol.dragover{outline:2px dashed var(--teal);outline-offset:-4px}
.leadcard{
  background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin-bottom:8px;
  box-shadow:var(--shadow);cursor:grab;transition:border-color .15s ease;
}
.leadcard:hover{border-color:var(--teal)}
.leadcard .nm{font-weight:700;font-size:13.5px}
.leadcard .row{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}
.leadcard .arrows{display:flex;gap:4px;margin-top:6px;justify-content:flex-end}
.kcol-collapsed{flex:0 0 46px;writing-mode:vertical-rl;text-orientation:mixed;background:var(--soft);border-radius:14px;padding:12px 10px;color:var(--muted);font-weight:600;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:8px}
.score-pill{font-weight:800;font-size:12px;border-radius:7px;padding:1px 7px;background:var(--chip)}
.score-pill.hi{background:var(--ok-soft);color:var(--teal-dk)}
.score-pill.mid{background:var(--amber-soft);color:var(--amber)}
.score-pill.lo{background:var(--danger-soft);color:var(--danger)}
html[data-theme="dark"] .score-pill.hi{color:#7ed4bb}

/* Tables */
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:53px;background:var(--card);z-index:5}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:var(--soft)}
.tbl tr.rowlink{cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* Close board */
.cboard{overflow-x:auto}
.cboard table{border-collapse:separate;border-spacing:0;min-width:880px;width:100%}
.cboard th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:8px 8px;text-align:center;border-bottom:1px solid var(--line)}
.cboard th .rng{display:block;font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);opacity:.8}
.cboard th:first-child{text-align:left}
.cboard td{padding:8px;border-bottom:1px solid var(--line);text-align:center}
.cboard td:first-child{text-align:left;white-space:nowrap}
.cboard .clientcell .nm{font-weight:700}
.cboard .clientcell .sub{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:2px}
.stage-dot{width:14px;height:14px;border-radius:50%;display:inline-block;background:var(--track);border:2px solid var(--track)}
.stage-dot.done{background:var(--chart1);border-color:var(--chart1)}
.stage-dot.cur{background:var(--card);border-color:var(--chart1)}
.stage-dot.overdue-dot{background:var(--danger);border-color:var(--danger)}
.stagebtn{padding:6px;border-radius:8px}
.stagebtn:hover{background:var(--soft)}
.qact{display:flex;gap:2px;justify-content:center}

/* Calendar */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calgrid .dow{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:center;padding:4px 0}
.calday{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:86px;padding:6px;font-size:11.5px;cursor:pointer;transition:border-color .15s ease;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.calday:hover{border-color:var(--teal)}
.calday.out{opacity:.45}
.calday.today{border-color:var(--teal);border-width:2px}
.calday.selected{outline:2px solid var(--teal)}
.calday .dnum{font-weight:700;font-size:12px}
.calday .ev{border-radius:5px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10.5px;font-weight:600}
.ev.ev-job{background:var(--ok-soft);color:var(--teal-dk)}
html[data-theme="dark"] .ev.ev-job{color:#7ed4bb}
.ev.ev-comp{background:var(--amber-soft);color:var(--amber)}
.ev.ev-hour{background:var(--chip);color:var(--muted)}
.ev.ev-rhythm{background:var(--navy);color:#fff}
html[data-theme="dark"] .ev.ev-rhythm{background:var(--soft);color:var(--ink)}
.agenda-item{display:flex;gap:10px;align-items:baseline;padding:8px 4px;border-bottom:1px solid var(--line)}
.agenda-item .d{font-weight:700;white-space:nowrap;width:92px;flex:0 0 auto}

/* Rules */
.rules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.rulecard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rulecard .n{font-size:11px;font-weight:800;color:var(--muted)}

/* Modals */
.modal-back{position:fixed;inset:0;background:rgba(10,23,37,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:100;overflow:auto}
.modal{background:var(--card);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:640px;padding:18px 20px;animation:pop .18s ease}
.modal.wide{max-width:780px}
.modal.narrow{max-width:440px}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.modal header h2{margin:0;flex:1}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.mrow.one{grid-template-columns:1fr}
.mrow label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps i{height:4px;border-radius:3px;flex:1;background:var(--track)}
.steps i.on{background:var(--teal)}
.blocked{background:var(--danger-soft);border:1px solid var(--danger);border-radius:12px;padding:12px 14px;color:var(--danger);font-weight:600}
.warnbox{background:var(--amber-soft);border:1px solid var(--gold);border-radius:12px;padding:11px 13px;color:var(--amber);font-size:13px}
.okbox{background:var(--ok-soft);border-radius:12px;padding:12px 14px}
.stopbox{background:var(--danger-soft);border:1.5px solid var(--danger);border-radius:12px;padding:12px 14px}
.stopbox b{color:var(--danger)}

/* Checklist */
.cl-section{margin-bottom:14px}
.cl-section>h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:5px}
.cl-item{display:flex;align-items:flex-start;gap:9px;padding:6px 2px;border-radius:8px}
.cl-item:hover{background:var(--soft)}
.cl-item input[type=checkbox]{width:16px;height:16px;margin-top:2px;accent-color:var(--teal);flex:0 0 auto;cursor:pointer}
.cl-item .txt{flex:1}
.cl-item.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.cl-item .dd{font-size:10.5px;color:var(--muted)}
.scorerow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.scorerow .f{flex:1;font-size:13px}
.scorerow .opts{display:flex;gap:3px}
.scorerow .opts button{width:26px;height:26px;border-radius:7px;background:var(--soft);font-size:12px;font-weight:700;color:var(--muted)}
.scorerow .opts button.on{background:var(--teal);color:#fff}
.gate-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.gate-row .g{flex:1;font-size:13px}
.gate-row .opts{display:flex;gap:3px}
.gate-row .opts button{padding:3px 9px;border-radius:7px;background:var(--soft);font-size:11.5px;font-weight:700;color:var(--muted)}
.gate-row .opts button.yes.on{background:var(--teal);color:#fff}
.gate-row .opts button.na.on{background:var(--gold);color:#1a2732}
.gate-row .opts button.no.on{background:var(--danger);color:#fff}

/* Toasts */
#toast-root{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{
  background:var(--navy);color:#fff;border-radius:11px;padding:10px 16px;box-shadow:var(--shadow);
  font-size:13.5px;font-weight:600;animation:pop .18s ease;max-width:340px;
}
html[data-theme="dark"] .toast{background:var(--teal);color:#fff}
.toast.err{background:var(--danger);color:#fff}

/* Client detail */
.cd-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cd-grid{display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start}
.vault .fr{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.vault .fr:last-child{border-bottom:0}
.vault .fr .k{width:150px;flex:0 0 auto;color:var(--muted);font-size:12px;font-weight:600}
.vault .fr input,.vault .fr select{padding:4px 8px;font-size:13px;border-color:transparent;background:transparent}
.vault .fr input:hover,.vault .fr select:hover{border-color:var(--line);background:var(--card)}
.vault .fr input:focus,.vault .fr select:focus{border-color:var(--focus);background:var(--card)}
.timeline .tl-item{display:flex;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);align-items:center}
.timeline .tl-item:hover{background:var(--soft)}
.hours-amber{color:var(--amber);font-weight:700}

/* Settings */

/* ============ time helpers: all date logic flows through now() ============ */
function now(){ return new Date(); }
function pad2(n){ return (n<10?"0":"")+n; }
function ymd(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }

function monthDay(ym,day){ var last=daysInMonth(ym); return ym+"-"+pad2(Math.min(day,last)); }
function daysInMonth(ym){ var p=ym.split("-"); return new Date(+p[0],+p[1],0).getDate(); }
function monthEnd(ym){ return ym+"-"+pad2(daysInMonth(ym)); }
function parseDate(s){ var p=(s||"").split("-"); return new Date(+p[0],(+p[1]||1)-1,+p[2]||1); }
function addDays(dateStr,n){ var d=parseDate(dateStr); d.setDate(d.getDate()+n); return ymd(d); }
function daysBetween(a,b){ return Math.round((parseDate(b)-parseDate(a))/86400000); }

var Backend={
  boot:function(){
    if(S.mode==="gas"){
      return gsCall("api_boot").then(function(res){
        S.user=res.user||"unknown";
        S.data=res.data;
        ["leads","clients","jobs","templates","compliance","log","settings"].forEach(function(k){ if(!S.data[k])S.data[k]=[]; });
      });
    }
    S.data=clone(DEMO_DATA);
    return Promise.resolve();
  },
  save:function(table,obj){
    if(S.mode==="gas"){
      return gsCall("api_upsert",table,obj).then(function(saved){
        applyLocal(table,saved); return saved;
      });
    }
    if(!obj.id)obj.id=uid(table.slice(0,2).toLowerCase());
    obj.updated=todayStr();
    applyLocal(table,obj);
    return Promise.resolve(obj);
  },
  remove:function(table,id){
    if(S.mode==="gas")return gsCall("api_delete",table,id);
    var arr=tableArr(table); var i=arr.findIndex(function(r){ return r.id===id; });
    if(i>-1)arr.splice(i,1);
    return Promise.resolve();
  }
};
function tableArr(table){
  return S.data[{Leads:"leads",Clients:"clients",Jobs:"jobs",Compliance:"compliance",Settings:"settings",Templates:"templates"}[table]||table];
}
function applyLocal(table,obj){
  var arr=tableArr(table); if(!arr)return;
  var key=table==="Settings"?"key":"id";
  var i=arr.findIndex(function(r){ return r[key]===obj[key]; });
  if(i>-1)arr[i]=obj; else arr.push(obj);
}
function gsCall(fn){
  var args=Array.prototype.slice.call(arguments,1);
  return new Promise(function(resolve,reject){
    var t=setTimeout(function(){ reject(new Error("Request timed out. Check your connection.")); },15000);
    var runner=google.script.run
      .withSuccessHandler(function(v){ clearTimeout(t); resolve(v); })
      .withFailureHandler(function(e){ clearTimeout(t); reject(e); });
    runner[fn].apply(runner,args);
  });
}
/* optimistic save: apply locally, persist, roll back on failure */
function persist(table,obj,logAction,logDetails){
  var arr=tableArr(table), key=table==="Settings"?"key":"id";
  var prevIdx=arr?arr.findIndex(function(r){ return r[key]===obj[key]; }):-1;
  var prev=prevIdx>-1?clone(arr[prevIdx]):null;
  if(!obj.id&&key==="id")obj.id=uid(table.slice(0,2).toLowerCase());
  obj.updated=todayStr(); if(!obj.created&&key==="id")obj.created=todayStr();
  applyLocal(table,obj);
  if(logAction)addLog(logAction,table,obj[key],logDetails);
  render();
  if(S.mode==="gas"){
    gsCall("api_upsert",table,obj).catch(function(err){
      if(prev)applyLocal(table,prev);
      else{ var i=arr.findIndex(function(r){ return r[key]===obj[key]; }); if(i>-1)arr.splice(i,1); }
      toast("Save failed: "+(err.message||err),"err");
      render();
    });
  }
  return obj;
}

function ensureMonthlyJobs(){
  var made=0, cm=curMonth(), day=now().getDate();
  var periods=[cm];
  if(day>=25)periods.push(monthAdd(cm,1));
  S.data.clients.forEach(function(c){
    if(c.status!=="Active"&&c.status!=="Onboarding")return;
    if(!c.first_close_month)return;
    periods.forEach(function(p){
      if(c.first_close_month>p)return;
      var exists=S.data.jobs.some(function(j){ return j.client_id===c.id&&j.type==="MonthlyClose"&&j.period===p; });
      if(exists)return;
      var job={id:uid("jb"),client_id:c.id,type:"MonthlyClose",period:p,title:monthLabel(p)+" close",
        stage:"Docs arriving",due:monthDay(p,settingNum("close_day",15)),internal_due:monthDay(p,settingNum("internal_close_day",13)),
        owner:"Both",waiting_on_client:"N",waiting_since:"",checklist:buildChecklistFromData("MonthlyClose"),
        hours:0,amc_count:0,parked_items:"",delivered_date:"",locked:"N",notes:"",created:todayStr(),updated:todayStr(),completed:""};
      S.data.jobs.push(job);
      addLog("spawn","Jobs",job.id,"Monthly close spawned for "+p+" ("+c.business_name+")");
      made++;
      if(S.mode==="gas")gsCall("api_upsert","Jobs",job).catch(function(){});
    });
  });
  return made;
}

/* ============ inline SVG charts (palette validated for both themes) ============ */
function svgSparkline(points,w,h){
  if(!points.length)return "";
  var vals=points.map(function(p){ return p.v; });
  var max=Math.max.apply(null,vals.concat([1])), min=Math.min.apply(null,vals.concat([0]));
  var span=(max-min)||1, px=8, py=6;
  var step=(w-px*2)/Math.max(points.length-1,1);
  var xy=points.map(function(p,i){ return [(px+i*step).toFixed(1),(h-py-((p.v-min)/span)*(h-py*2)).toFixed(1)]; });
  var path=xy.map(function(c,i){ return (i?"L":"M")+c[0]+" "+c[1]; }).join(" ");
  var area=path+" L"+xy[xy.length-1][0]+" "+(h-2)+" L"+xy[0][0]+" "+(h-2)+" Z";
  var last=xy[xy.length-1];
  return '<svg viewBox="0 0 '+w+' '+h+'" class="kchart" style="aspect-ratio:'+w+'/'+h+'" role="img" aria-label="Trend, latest '+esc(String(points[points.length-1].v))+'">'+
    '<path d="'+area+'" fill="var(--chart1)" opacity="0.1"></path>'+
    '<path d="'+path+'" fill="none" stroke="var(--chart1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>'+
    '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="4" fill="var(--chart1)" stroke="var(--card)" stroke-width="2"></circle>'+
    '</svg>';
}
function svgBars(bars,w,h){
  /* bars: [{label, v, max, warn}] with value labels on caps */
  if(!bars.length)return "";
  var max=Math.max.apply(null,bars.map(function(b){ return b.max!=null?b.max:b.v; }).concat([1]));
  var gap=2, bw=Math.min(24,Math.floor((w-8)/bars.length)-gap), top=13, bot=13;
  var out='<svg viewBox="0 0 '+w+' '+h+'" class="kchart" style="aspect-ratio:'+w+'/'+h+'" role="img" aria-label="Bar chart">';
  out+='<line x1="4" y1="'+(h-bot)+'" x2="'+(w-4)+'" y2="'+(h-bot)+'" stroke="var(--chart-grid)" stroke-width="1"></line>';
  bars.forEach(function(b,i){
    var x=6+i*(bw+gap+4);
    var bh=Math.max(2,Math.round((b.v/max)*(h-top-bot)));
    var y=h-bot-bh;
    var col=b.warn?"var(--chart2)":"var(--chart1)";
    out+='<path d="M'+x+' '+(h-bot)+' V'+(y+4)+' Q'+x+' '+y+' '+(x+4)+' '+y+' H'+(x+bw-4)+' Q'+(x+bw)+' '+y+' '+(x+bw)+' '+(y+4)+' V'+(h-bot)+' Z" fill="'+col+'"></path>';
    out+='<text x="'+(x+bw/2)+'" y="'+(y-3)+'" text-anchor="middle" font-size="9.5" fill="var(--ink)">'+esc(String(b.v))+'</text>';
    out+='<text x="'+(x+bw/2)+'" y="'+(h-3)+'" text-anchor="middle" font-size="8.5" fill="var(--muted)">'+esc(b.label)+'</text>';
  });
  return out+"</svg>";
}

function viewToday(){
  var ceil=settingNum("solo_ceiling_clients",15), capPct=settingNum("restaurant_cap_pct",25), hFlag=settingNum("hours_flag",9);
  var act=activeClients(), nAct=act.length;
  var cot=closesOnTime(curMonth());
  var waiting=openJobs().filter(function(j){ return j.waiting_on_client==="Y"; });
  var oldestWait=waiting.reduce(function(m,j){ return Math.max(m,waitDays(j)); },0);
  var hrs=hoursThisMonth(), hBudget=nAct*hFlag;
  var rPct=restaurantPct();
  var hist=[];
  for(var i=5;i>=1;i--){ var m=monthAdd(curMonth(),-i); var h=closesOnTime(m); hist.push({label:monthLabelShort(m).split(" ")[0],v:h.on,max:Math.max(h.total,1)}); }
  hist.push({label:monthLabelShort(curMonth()).split(" ")[0],v:cot.on,max:Math.max(cot.total,1)});
  var mrrPts=mrrHistory(6).map(function(p){ return {v:p.v}; });

  var jobs=openJobs();
  if(S.ui.myday!=="All")jobs=jobs.filter(function(j){ return j.owner===S.ui.myday||j.owner==="Both"; });
  if(S.ui.todayFilter==="waiting")jobs=jobs.filter(function(j){ return j.waiting_on_client==="Y"; });
  var t=todayStr(), in7=addDays(t,7), in14=addDays(t,14);
  var buckets={overdue:[],today:[],week:[],next:[]};
  jobs.forEach(function(j){
    if(!j.due)return;
    if(j.due<t)buckets.overdue.push(j);
    else if(j.due===t)buckets.today.push(j);
    else if(j.due<=in7)buckets.week.push(j);
    else if(j.due<=in14)buckets.next.push(j);
  });
  Object.keys(buckets).forEach(function(k){ buckets[k].sort(function(a,b){ return a.due<b.due?-1:1; }); });
  function bucket(key,title,list){
    return '<div class="bucket '+key+'"><h3>'+title+' <span class="cnt num">'+list.length+'</span></h3>'+
      (list.length?list.map(function(j){ return jobCardHtml(j); }).join(""):'<div class="empty small">Nothing here. Good.</div>')+'</div>';
  }
  return '<div class="vhead"><h1>Today</h1><span class="muted small">'+dateLabel(t)+", "+now().getFullYear()+'</span><span class="spacer"></span>'+
    '<div class="seg" role="group" aria-label="My day filter">'+["All","Sarah","Brad"].map(function(o){
      return '<button type="button" data-act="myday" data-v="'+o+'" class="'+(S.ui.myday===o?"on":"")+'">'+o+'</button>'; }).join("")+'</div>'+
    '<div class="seg" role="group" aria-label="Saved filters">'+
      '<button type="button" data-act="today-filter" data-v="all" class="'+(S.ui.todayFilter==="all"?"on":"")+'">All work</button>'+
      '<button type="button" data-act="today-filter" data-v="waiting" class="'+(S.ui.todayFilter==="waiting"?"on":"")+'">Waiting on client ('+waiting.length+')</button>'+
    '</div></div>'+
  '<div class="grid-kpi">'+
    '<div class="kpi'+(nAct>=ceil?" warn":"")+'"><span class="lbl">Active clients</span><span class="val num">'+nAct+' <span class="unit">of '+ceil+'</span></span>'+
      meterHtml(nAct*100/ceil,nAct>=ceil?"m-red":nAct>=ceil-2?"m-amber":"","Roster at "+nAct+" of the "+ceil+" client ceiling")+
      '<span class="sub">Solo ceiling '+ceil+'</span></div>'+
    '<div class="kpi"><span class="lbl">Closes on time, '+esc(monthLabelShort(curMonth()))+'</span><span class="val num">'+cot.on+'<span class="unit">/'+cot.total+'</span></span>'+
      svgBars(hist,168,58)+'</div>'+
    '<div class="kpi'+(oldestWait>=7?" warn":"")+'"><span class="lbl">Waiting on client</span><span class="val num">'+waiting.length+'</span>'+
      '<span class="sub">'+(waiting.length?("Oldest "+oldestWait+" days"+(oldestWait>=21?". Park and name it (SOP-015)":"")):"Nobody is holding you up")+'</span></div>'+
    '<div class="kpi'+(hrs>hBudget&&hBudget?" warn":"")+'"><span class="lbl">Hours this month</span><span class="val num">'+hrs+'<span class="unit"> of '+hBudget+'h</span></span>'+
      meterHtml(hBudget?hrs*100/hBudget:0,hrs>hBudget?"m-red":hrs>hBudget*0.8?"m-amber":"","Hours "+hrs+" of "+hBudget)+
      '<span class="sub">Budget: '+hFlag+'h per client</span></div>'+
    '<div class="kpi"><span class="lbl">MRR</span><span class="val num">'+fmtMoney(mrr())+'</span>'+svgSparkline(mrrPts,168,44)+'<span class="sub">Trailing 6 months</span></div>'+
    '<div class="kpi'+(rPct>capPct?" warn":"")+'"><span class="lbl">Restaurant share</span><span class="val num">'+rPct+'<span class="unit">%</span></span>'+
      meterHtml(rPct,rPct>capPct?"m-red":rPct>capPct-5?"m-amber":"","Restaurants at "+rPct+" percent of roster")+
      '<span class="sub">'+(rPct>capPct?"Over the "+capPct+"% cap (SOP-010)":"Cap "+capPct+"% of roster")+'</span></div>'+
  '</div>'+
  '<div class="buckets">'+
    bucket("overdue","Overdue",buckets.overdue)+
    bucket("today","Due today",buckets.today)+
    bucket("week","This week",buckets.week)+
    bucket("next","Next week",buckets.next)+
  '</div>';
}

/* ============ Calendar ============ */
function calendarEvents(ym){
  var evs={}; /* date -> [{t,cls,title,act,id}] */
  function push(d,e){ if(monthOf(d)!==ym)return; (evs[d]=evs[d]||[]).push(e); }
  push(monthDay(ym,1),{cls:"ev-rhythm",title:"ACH draft day"});
  push(monthDay(ym,settingNum("gap_day",14)),{cls:"ev-rhythm",title:"The Gap"});
  push(monthDay(ym,settingNum("close_day",15)),{cls:"ev-rhythm",title:"Close delivery day"});
  S.data.jobs.forEach(function(j){
    if(jobDone(j)||!j.due)return;
    var c=clientById(j.client_id);
    push(j.due,{cls:"ev-job",title:(c?c.business_name:"")+": "+j.title,act:"open-job",id:j.id});
  });
  S.data.compliance.forEach(function(cp){

/* ============ toasts ============ */
function toast(msg,cls){
  var root=document.getElementById("toast-root");
  var el=document.createElement("div");
  el.className="toast"+(cls==="err"?" err":"");
  el.setAttribute("role","status");
  el.textContent=msg;
  root.appendChild(el);
  setTimeout(function(){ el.style.opacity="0"; el.style.transition="opacity .3s"; },2600);
  setTimeout(function(){ if(el.parentNode)el.parentNode.removeChild(el); },3000);
}

/* ============ modal rendering ============ */
function openModal(m){ S.ui.modal=m; renderModal(); }
function closeModal(){ S.ui.modal=null; renderModal(); }
function renderModal(){
  var root=document.getElementById("modal-root");
  var m=S.ui.modal;
  if(!m){ root.innerHTML=""; return; }
  var inner=
    m.kind==="job"?modalJob(m):
    m.kind==="lead"?modalLead(m):
    m.kind==="preflight"?modalPreflight(m):
    m.kind==="wizard"?modalWizard(m):
    m.kind==="offboard"?modalOffboard(m):
    m.kind==="newjob"?modalNewJob(m):
    m.kind==="confirm"?modalConfirm(m):"";
  root.innerHTML='<div class="modal-back" data-act="modal-back">'+inner+'</div>';
  var box=root.querySelector(".modal");
  if(box){ var f=box.querySelector("input,select,textarea,button.btn-pri"); if(f)f.focus(); }
}

/* ============ global search ============ */
function searchHits(q){
  q=q.toLowerCase();
  function match(s){ return s&&String(s).toLowerCase().indexOf(q)>-1; }
  var hits={Leads:[],Clients:[],Jobs:[],Notes:[]};
  S.data.leads.forEach(function(l){
    if(match(l.business_name)||match(l.contact_name)||match(l.email))hits.Leads.push({t:l.business_name,sub:l.stage,act:"open-lead",id:l.id});
    else if(match(l.notes))hits.Notes.push({t:l.business_name+" (lead note)",sub:l.notes.slice(0,60),act:"open-lead",id:l.id});
  });
  S.data.clients.forEach(function(c){
    if(match(c.business_name)||match(c.contact_name)||match(c.email))hits.Clients.push({t:c.business_name,sub:c.status+" · "+c.tier,act:"open-client",id:c.id});
    else if(match(c.notes))hits.Notes.push({t:c.business_name+" (client note)",sub:c.notes.slice(0,60),act:"open-client",id:c.id});
  });
  S.data.jobs.forEach(function(j){
    var c=clientById(j.client_id);
    if(match(j.title)||(c&&match(c.business_name)&&match(j.title)))hits.Jobs.push({t:(c?c.business_name+": ":"")+j.title,sub:j.stage,act:"open-job",id:j.id});
    else if(match(j.notes)||match(j.parked_items))hits.Notes.push({t:(c?c.business_name+": ":"")+j.title,sub:(j.notes||j.parked_items).slice(0,60),act:"open-job",id:j.id});
  });
  return hits;
}
function renderSearchPop(){
  var pop=document.getElementById("search-pop"); if(!pop)return;
  if(!S.ui.searchOpen||!S.ui.search){ pop.innerHTML=""; return; }
  var hits=searchHits(S.ui.search), flat=[],html="";
  Object.keys(hits).forEach(function(g){
    if(!hits[g].length)return;
    html+='<div class="grp">'+g+'</div>';
    hits[g].forEach(function(h){
      var i=flat.length; flat.push(h);
      html+='<button type="button" class="hit'+(i===S.ui.searchSel?" sel":"")+'" data-act="'+h.act+'" data-id="'+h.id+'" data-from-search="1">'+
        '<b>'+esc(h.t)+'</b> <span class="tiny muted">'+esc(h.sub||"")+'</span></button>';
    });
  });
  S.ui.searchFlat=flat;
  pop.innerHTML='<div class="search-pop" role="listbox" aria-label="Search results">'+(html||'<div class="grp">No matches</div>')+'</div>';
}

function setJobStage(id,stage,gapConfirmed){
  var j=jobById(id); if(!j)return;
  var from=j.stage;
  if(j.type==="MonthlyClose"&&from==="Close in progress"&&stage==="Locked and delivered"&&!gapConfirmed){
    openModal({kind:"confirm",title:"The Gap comes first",
      msg:"SOP-001 requires the overnight Gap review before delivery. Confirm the Gap happened.",
      okLabel:"The Gap happened",act:"gap-confirmed",payload:{id:id,stage:stage}});
    return;
  }
  j.stage=stage;
  if(gapConfirmed)addLog("gap_confirmed","Jobs",j.id,"Gap review confirmed before delivery");
  if(stage==="Locked and delivered"&&j.type==="MonthlyClose"){ if(!j.delivered_date)j.delivered_date=todayStr(); j.locked="Y"; }
  if(stage==="Done"){
    j.completed=todayStr();
    if(j.type==="MonthlyClose"){ if(!j.delivered_date)j.delivered_date=todayStr(); j.locked="Y"; }
    if(j.waiting_on_client==="Y"){ j.waiting_on_client="N"; j.waiting_since=""; }
    if(j.type==="Offboarding"){
      var c=clientById(j.client_id);
      if(c&&c.status==="Offboarding"){ c.status="Former"; persist("Clients",c,"update","Offboarding complete, status Former"); }
    }
  }
  persist("Jobs",j,"update","Stage "+from+" to "+stage);
  toast("Stage: "+stage);
}
function toggleWaiting(id){
  var j=jobById(id); if(!j)return;
  if(j.waiting_on_client==="Y"){ j.waiting_on_client="N"; j.waiting_since=""; toast("Waiting cleared"); }
  else{ j.waiting_on_client="Y"; j.waiting_since=todayStr(); toast("Waiting on client, aging starts today"); }

function stepHours(id,delta){
  var j=jobById(id); if(!j)return;

  if(S.mode==="gas"){
    applyLocal("Jobs",j); addLog("hours","Jobs",j.id,"Hours now "+j.hours); render();
    gsCall("api_log_hours",j.id,j.hours).catch(function(err){ toast("Hours save failed: "+(err.message||err),"err"); });
  }else persist("Jobs",j,"hours","Hours now "+j.hours);
  var c=clientById(j.client_id);
  var mh=c?clientHoursMonth(c.id,curMonth()):0, flag=settingNum("hours_flag",9);

  persist("Jobs",j,"check","'"+j.checklist[idx].i.slice(0,50)+"' "+(checked?"done":"undone"));

function moveLeadTo(id,stage){
  var l=leadById(id); if(!l)return;
  if(stage===l.stage)return;
  if(stage==="Pre-flight"){
    l.stage="Pre-flight";
    persist("Leads",l,"update","Stage to Pre-flight");
    openModal({kind:"preflight",leadId:id,answers:PREFLIGHT_GATES.map(function(){ return null; }),notes:{}});
    return;
  }
  if(stage==="Letter sent"){
    openModal({kind:"preflight",leadId:id,answers:PREFLIGHT_GATES.map(function(){ return null; }),notes:{}});
    toast("Letter sent needs all 11 gates first");
    return;
  }
  if(stage==="Declined"||stage==="Lost"){
    var reason=stage==="Declined"?"Declined at "+l.stage:"";
    l.stage=stage; l.decline_reason=l.decline_reason||reason;
    persist("Leads",l,"update","Stage to "+stage);
    return;
  }
  l.stage=stage;
  persist("Leads",l,"update","Stage to "+stage);
  if(stage==="Signed")toast("Signed. Use Convert to create the client.");
}

function complianceDone(id){

  (cp.done_log=cp.done_log||[]).push(todayStr());

  if(fr.indexOf("monthly")>-1)cp.next_date=monthDay(monthAdd(monthOf(cp.next_date||todayStr()),1),+((cp.next_date||"").slice(8,10))||1);
  else if(fr.indexOf("annual")>-1)cp.next_date=monthDay(monthAdd(monthOf(cp.next_date||todayStr()),12),+((cp.next_date||"").slice(8,10))||1);

}

/* ============ event delegation ============ */
function onAction(act,el,ev){
  var id=el.getAttribute("data-id"), v=el.getAttribute("data-v"), m=S.ui.modal;
  switch(act){
    case "nav": nav(el.getAttribute("data-view")); break;
    case "toggle-theme":
      var t=S.ui.theme==="dark"?"light":"dark";
      applyTheme(t);
      var row=S.data.settings.find(function(r){ return r.key==="theme"; })||{key:"theme",value:t};
      row.value=t; persist("Settings",row);
      break;
    case "myday": S.ui.myday=v; render(); break;
    case "today-filter": S.ui.todayFilter=v; render(); break;
    case "board-month": S.ui.boardMonth=v; render(); break;
    case "cal-month": S.ui.calMonth=v; S.ui.calSel=""; render(); break;
    case "cal-mode": S.ui.calMode=v; render(); break;
    case "cal-day": S.ui.calSel=S.ui.calSel===v?"":v; render(); break;
    case "toggle-closed": S.ui.pipeShowClosed=!S.ui.pipeShowClosed; render(); break;
    case "open-client": closeModal(); S.ui.view="clients"; S.ui.clientId=id; render(); window.scrollTo(0,0); break;
    case "open-job": closeModal(); openModal({kind:"job",id:id}); break;
    case "open-compliance": nav("settings"); break;
    case "open-lead":
      var l=leadById(id); if(!l)break;
      openModal({kind:"lead",id:id,form:Object.assign({scores:{}},clone(l),{scores:scoresFromTotal(l)})});
      break;
    case "new-lead": openModal({kind:"lead",id:null,step:"hard",form:leadFormBlank()}); break;
    case "lead-hard-yes": m.step=null; renderModal(); break;
    case "lead-hard-no": m.step="declined"; renderModal(); break;
    case "lead-declined-save":
      var dl=Object.assign(leadFormBlank(),{business_name:m.form.business_name||"(unnamed)",stage:"Declined",hard_filter_fail:v,decline_reason:v,id:"",created:todayStr(),score:0});
      delete dl.scores;
      persist("Leads",dl,"create","Instant decline: "+v);
      closeModal(); toast("Declined: "+v);
      break;
    case "lead-save": saveLeadFromModal(); break;
    case "lead-delete":
      openModal({kind:"confirm",title:"Delete lead",msg:"Delete this lead for good? Leads are the only thing that hard-deletes.",okLabel:"Delete",act:"lead-delete-yes",payload:{id:id}});
      break;
    case "lead-move":
      var ld=leadById(id), di=+el.getAttribute("data-dir");
      var ni=LEAD_STAGES.indexOf(ld.stage)+di;
      if(ni>=0&&ni<LEAD_STAGES.length)moveLeadTo(id,LEAD_STAGES[ni]);
      break;
    case "convert-lead":
      var cl=leadById(id);
      closeModal();
      openModal({kind:"wizard",step:1,fromLead:id,guard:{ach:null,portal:null,scope:null},
        form:{business_name:cl.business_name,contact_name:cl.contact_name,email:cl.email,phone:cl.phone,vertical:cl.vertical,
          tier:cl.quoted_tier||"Standard",monthly_fee:cl.quoted_fee||"",effective_date:todayStr(),
          first_close_month:suggestFirstClose(todayStr()),weekly_hour_day:"Mon"}});
      break;
    case "add-client":
      openModal({kind:"wizard",step:1,fromLead:null,guard:{ach:null,portal:null,scope:null},
        form:{vertical:"Contractor",tier:"Essentials",monthly_fee:tiersCfg().tiers.Essentials.fee,effective_date:todayStr(),weekly_hour_day:"Mon"}});
      break;
    case "wiz-tier":
      m.form.tier=v; m.form.monthly_fee=tiersCfg().tiers[v].fee; renderModal(); break;
    case "wiz-next": m.step++; renderModal(); break;
    case "wiz-back": m.step--; renderModal(); break;
    case "wiz-create": createClientFromWizard(); break;
    case "guard-set": m.guard[el.getAttribute("data-k")]=v; renderModal(); break;
    case "score-set":
      m.form.scores=m.form.scores||{};
      m.form.scores[el.getAttribute("data-k")]=+v; renderModal(); break;
    case "gate-set": m.answers[+el.getAttribute("data-i")]=v; renderModal(); break;
    case "preflight-save":
      addLog("preflight","Leads",m.leadId,"Gates saved: "+gateSummary(m));
      closeModal(); toast("Gates saved. Nothing advanced.");
      break;
    case "preflight-advance":
      var pl=leadById(m.leadId);
      addLog("preflight_pass","Leads",m.leadId,"All 11 gates cleared: "+gateSummary(m));
      pl.stage="Letter sent";
      persist("Leads",pl,"update","Advanced to Letter sent, gates cleared");
      closeModal(); toast("Cleared. Letter sent.");
      break;
    case "offboard": openModal({kind:"offboard",clientId:id,form:{}}); break;
    case "offboard-create": offboardCreate(); break;
    case "new-custom-job": openModal({kind:"newjob",clientId:id,form:{type:"Custom",owner:"Sarah"}}); break;
    case "newjob-create":
      if(!m.form.title){ toast("A title is required","err"); break; }
      var nj={id:"",client_id:m.clientId,type:m.form.type||"Custom",period:"",title:m.form.title,stage:"Open",
        due:m.form.due||addDays(todayStr(),7),internal_due:"",owner:m.form.owner||"Sarah",waiting_on_client:"N",waiting_since:"",
        checklist:[],hours:0,amc_count:0,parked_items:"",delivered_date:"",locked:"N",notes:"",created:todayStr(),updated:todayStr(),completed:""};
      persist("Jobs",nj,"create",nj.title);
      closeModal(); toast("Job created");
      break;
    case "toggle-wait": toggleWaiting(id); if(S.ui.modal&&S.ui.modal.kind==="job")renderModal(); break;
    case "hours-quick": stepHours(id,0.25); break;
    case "hours-step": stepHours(id,+v); if(S.ui.modal&&S.ui.modal.kind==="job")renderModal(); break;
    case "job-done-ask":
      openModal({kind:"confirm",title:"Mark job done",msg:"Mark this job done? Unchecked items stay recorded as skipped.",okLabel:"Mark done",act:"job-done",payload:{id:id}});
      break;
    case "comp-done": complianceDone(id); break;
    case "export-json": exportJson(); break;
    case "import-json": document.getElementById("import-file").click(); break;
    case "confirm-ok":
      var cm2=S.ui.modal; S.ui.modal=null;
      if(cm2.act==="job-done")setJobStage(cm2.payload.id,"Done");
      else if(cm2.act==="gap-confirmed")setJobStage(cm2.payload.id,cm2.payload.stage,true);
      else if(cm2.act==="lead-delete-yes"){
        Backend.remove("Leads",cm2.payload.id);
        addLog("delete","Leads",cm2.payload.id,"Lead deleted");
        closeModal(); render(); toast("Lead deleted");
      }
      renderModal();
      break;
    case "modal-close": closeModal(); break;
    case "modal-back": if(ev.target===el)closeModal(); break;
  }
}
function gateSummary(m){
  return m.answers.map(function(a,i){ return (i+1)+":"+(a||"unset")+(a==="na"&&m.notes[i]?"("+m.notes[i]+")":""); }).join(" ");
}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");
  if(!el)return;
  var fromSearch=el.getAttribute("data-from-search");
  onAction(el.getAttribute("data-act"),el,e);
  if(fromSearch){ S.ui.searchOpen=false; S.ui.search=""; var si=document.getElementById("global-search"); if(si)si.value=""; renderSearchPop(); }
});
document.addEventListener("keydown",function(e){
  var el=e.target.closest("[data-act]");
  if(el&&(e.key==="Enter"||e.key===" ")&&el.tagName!=="BUTTON"&&el.tagName!=="A"&&el.tagName!=="INPUT"&&el.tagName!=="SELECT"&&el.tagName!=="TEXTAREA"){
    e.preventDefault(); onAction(el.getAttribute("data-act"),el,e);
  }
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.matches("[data-mf]")&&S.ui.modal){
    S.ui.modal.form[t.getAttribute("data-mf")]=t.type==="number"?(t.value===""?"":+t.value):t.value;
    if(t.getAttribute("data-rerender")){
      if(t.getAttribute("data-mf")==="effective_date")S.ui.modal.form.first_close_month=suggestFirstClose(t.value);
      renderModal();
    }
    return;
  }
  if(t.matches("[data-mf-stage]")&&S.ui.modal){ S.ui.modal.form.stage=t.value; return; }
  if(t.matches("[data-gate-note]")&&S.ui.modal){ S.ui.modal.notes[+t.getAttribute("data-gate-note")]=t.value; return; }
  if(t.matches("[data-vault]")){
    var c=clientById(t.getAttribute("data-id")); if(!c)return;
    var k=t.getAttribute("data-vault");
    c[k]=t.type==="number"?(t.value===""?"":+t.value):t.value;
    persist("Clients",c,"update","Set "+k);
    if(k==="status"||k==="first_close_month")ensureMonthlyJobs();
    toast("Saved");
    return;
  }
  if(t.matches("[data-setting]")){
    var row=S.data.settings.find(function(r){ return r.key===t.getAttribute("data-setting"); })||{key:t.getAttribute("data-setting"),value:""};
    row.value=t.value;
    persist("Settings",row,"update","Setting "+row.key);
    toast("Saved");
    return;
  }
  if(t.matches("[data-job-stage]")){ setJobStage(t.getAttribute("data-job-stage"),t.value.replace(/ \(.*\)$/,"")); if(S.ui.modal&&S.ui.modal.kind==="job")renderModal(); return; }
  if(t.matches("[data-job-field]")){ saveJobField(t.getAttribute("data-job"),t.getAttribute("data-job-field"),t.value); return; }
  if(t.matches("[data-cl]")){ toggleChecklist(t.getAttribute("data-job"),+t.getAttribute("data-cl"),t.checked); if(S.ui.modal&&S.ui.modal.kind==="job")renderModal(); return; }
  if(t.id==="import-file"&&t.files&&t.files[0]){
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var d=JSON.parse(rd.result);
        ["leads","clients","jobs","templates","compliance","log","settings"].forEach(function(k){ if(!d[k])throw new Error("missing "+k); });
        S.data=d; ensureMonthlyJobs(); render(); toast("Imported");
      }catch(err){ toast("Import failed: "+err.message,"err"); }
    };
    rd.readAsText(t.files[0]);
    t.value="";
  }
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="global-search"){
    S.ui.search=t.value; S.ui.searchOpen=!!t.value; S.ui.searchSel=0; renderSearchPop(); return;
  }
  if(t.matches("[data-act-input]")){
    var k=t.getAttribute("data-act-input");
    if(k==="client-query"){ S.ui.clientQuery=t.value; refreshClientsBody(); }
    if(k==="client-status"){ S.ui.clientStatus=t.value; render(); }
  }
});
function refreshClientsBody(){
  /* re-render without stealing focus from the filter box */
  var input=document.getElementById("view").querySelector('[data-act-input="client-query"]');
  var pos=input?input.selectionStart:0;
  render();
  var ni=document.getElementById("view").querySelector('[data-act-input="client-query"]');
  if(ni){ ni.focus(); ni.setSelectionRange(pos,pos); }
}
document.addEventListener("keydown",function(e){
  var tag=(e.target.tagName||"").toLowerCase();
  var typing=tag==="input"||tag==="textarea"||tag==="select";
  if(e.key==="Escape"){
    if(S.ui.searchOpen){ S.ui.searchOpen=false; renderSearchPop(); return; }
    if(S.ui.modal){ closeModal(); return; }
  }
  if(e.target.id==="global-search"&&S.ui.searchOpen){
    var flat=S.ui.searchFlat||[];
    if(e.key==="ArrowDown"){ e.preventDefault(); S.ui.searchSel=Math.min(S.ui.searchSel+1,flat.length-1); renderSearchPop(); return; }
    if(e.key==="ArrowUp"){ e.preventDefault(); S.ui.searchSel=Math.max(S.ui.searchSel-1,0); renderSearchPop(); return; }
    if(e.key==="Enter"&&flat[S.ui.searchSel]){
      e.preventDefault();
      var h=flat[S.ui.searchSel];
      S.ui.searchOpen=false; S.ui.search=""; e.target.value=""; renderSearchPop();
      if(h.act==="open-client"){ S.ui.view="clients"; S.ui.clientId=h.id; render(); }
      else if(h.act==="open-job")openModal({kind:"job",id:h.id});
      else if(h.act==="open-lead"){ var l2=leadById(h.id); openModal({kind:"lead",id:h.id,form:Object.assign({scores:{}},clone(l2))}); }
      return;
    }
  }
  if(typing||S.ui.modal)return;
  if(e.key==="/"){ e.preventDefault(); var si=document.getElementById("global-search"); if(si)si.focus(); return; }
  if(e.key==="n"){ e.preventDefault(); onAction("new-lead",document.body,e); return; }
  if(e.key==="c"){ e.preventDefault(); onAction("add-client",document.body,e); return; }
  var n=+e.key;
  if(n>=1&&n<=7){ nav(VIEWS[n-1]); }
});
/* drag and drop for the pipeline */
document.addEventListener("dragstart",function(e){
  var card=e.target.closest&&e.target.closest("[data-lead]");
  if(card)e.dataTransfer.setData("text/lead",card.getAttribute("data-lead"));
});
document.addEventListener("dragover",function(e){
  var col=e.target.closest&&e.target.closest("[data-drop-stage]");
  if(col){ e.preventDefault(); col.classList.add("dragover"); }
});
document.addEventListener("dragleave",function(e){
  var col=e.target.closest&&e.target.closest("[data-drop-stage]");
  if(col)col.classList.remove("dragover");
});
document.addEventListener("drop",function(e){
  var col=e.target.closest&&e.target.closest("[data-drop-stage]");
  if(!col)return;
  e.preventDefault(); col.classList.remove("dragover");
  var id=e.dataTransfer.getData("text/lead");
  if(id)moveLeadTo(id,col.getAttribute("data-drop-stage"));
});
document.addEventListener("click",function(e){
  if(!e.target.closest(".search-wrap")&&S.ui.searchOpen){ S.ui.searchOpen=false; renderSearchPop(); }
});

/* ============ init ============ */
function init(){
  Backend.boot().then(function(){
    var t=setting("theme","light");
    applyTheme(t==="dark"?"dark":"light");
    ensureMonthlyJobs();
    renderShell();
    render();
  }).catch(function(err){
    document.getElementById("app").innerHTML='<div class="view"><div class="empty">Could not load. '+esc(err.message||String(err))+'</div></div>';
  });
}
if(typeof document!=="undefined"&&document.readyState!=="loading")init();
else if(typeof document!=="undefined")document.addEventListener("DOMContentLoaded",init);
</script>
