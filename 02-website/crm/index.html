<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Relief Pros HQ</title>
<style>
  :root{--navy:#12293f;--teal:#1f8a70;--soft:#f5f8fa;--ink:#1a2732;--muted:#5b6a78;--line:#e4e9ee}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--soft);color:var(--ink);display:grid;place-items:center;min-height:100vh}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(18,41,63,.08);padding:36px 40px;max-width:420px;text-align:center}
  h1{font-size:20px;color:var(--navy);margin:0 0 6px}
  p{font-size:14px;color:var(--muted);line-height:1.6;margin:8px 0}
  .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;margin:0 auto 14px;animation:r 0.8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  code{background:var(--soft);padding:2px 6px;border-radius:6px;font-size:12.5px}
</style>
</head>
<body>
<div class="card" id="c">
  <div class="spin" id="s"></div>
  <h1>Relief Pros HQ</h1>
  <p id="msg">Opening the workspace…</p>
</div>
<script>
// Paste the Apps Script web app URL between the quotes, then run sync.bat.
var APP_URL = "https://script.google.com/macros/s/AKfycbzMOD3CA1EBWUbxaZ3qahK99jdofXuVyZ7V6tLXQXMDllAW04WyWanOo6NwRnKo0Np4/exec";
if (APP_URL) {
  location.replace(APP_URL);
} else {
  document.getElementById("s").style.display = "none";
  document.getElementById("msg").innerHTML =
    "Not linked yet. Paste the deployed web app URL into <code>APP_URL</code> in " +
    "<code>02-website/crm/index.html</code>. Steps live in <code>07-crm/DEPLOY.md</code>.";
}
</script>
</body>
</html>
